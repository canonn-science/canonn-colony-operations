<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canonn Colony Operations</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta
      name="description"
      content="Canonn BGS is an Elite Dangerous background-simulation tracker showing Canonn and Canonn Deep Space Research faction influence, controlling factions and architect details across the Canonn system network."
    />

    <style>
      /* The app's global styles only load after bootstrap, so give the document a height
         here — otherwise the height:100% splash wrapper collapses and the centred logo
         is pulled off the top of the viewport. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <app-root>
      <div style="position: relative; height: 100%; width: 100%">
        <div
          style="
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
          "
        >
          <img src="assets/canonn.svg" alt="" style="width: 100px; height: 100px" />
          <noscript>
            <span style="color: #fff"> Javascript is required to run this application. </span>
          </noscript>
        </div>
      </div>
    </app-root>
  </body>
</html>
